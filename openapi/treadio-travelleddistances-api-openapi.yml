components:
  schemas:
    TravelledDistanceType:
      title: TravelledDistanceType
      x-stoplight:
        id: tdtdr7x9k2abc
      type: string
      enum:
      - off_job
      - unloaded
      - loaded
      description: Type of travelled distance based on load state
    Timestamps:
      title: Timestamps
      x-stoplight:
        id: t82ecgfu0oj00
      type: object
      required:
      - created_at
      - updated_at
      properties:
        created_at:
          type: string
          x-stoplight:
            id: gjj950jpq0ga9
          format: date-time
          description: ISO8601 timestamp with local timezone
        updated_at:
          type: string
          x-stoplight:
            id: bwcuyfwc7aj0e
          format: date-time
          description: ISO8601 timestamp with local timezone
      additionalProperties: false
    Identifier:
      title: Identifier
      x-stoplight:
        id: gnd39lue5v7ol
      type: object
      required:
      - id
      properties:
        id:
          type: string
          x-stoplight:
            id: 2e38hjk4zd58m
          format: uuid
      additionalProperties: false
    TravelledDistance-Read:
      title: TravelledDistance-Read
      x-stoplight:
        id: tdddr7x9k2abc
      allOf:
      - $ref: '#/components/schemas/Identifier'
      - $ref: '#/components/schemas/Timestamps'
      - type: object
        required:
        - administrative_area
        - travelled_distance_meters
        - travelled_distance_type
        properties:
          administrative_area:
            $ref: '#/components/schemas/AdministrativeArea'
          travelled_distance_meters:
            type: string
          travelled_distance_type:
            $ref: '#/components/schemas/TravelledDistanceType'
          equipment:
            $ref: '#/components/schemas/Equipment-Read-Minimal'
    Error-Response:
      title: Error-Response
      x-stoplight:
        id: 52cydhphee3qe
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
      additionalProperties: false
    UnauthenticatedError-Response:
      title: UnauthenticatedError-Response
      x-stoplight:
        id: o477eph7ttbzt
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/UnauthenticatedError'
      additionalProperties: false
    AdministrativeArea:
      title: AdministrativeArea
      x-stoplight:
        id: aadr7x9k2abc
      type: string
      enum:
      - Unknown
      - Alabama
      - Alaska
      - American Samoa
      - Arizona
      - Arkansas
      - California
      - Colorado
