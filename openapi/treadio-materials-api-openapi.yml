          id: qdq705bx4imz5
        properties:
          name:
            type: string
            x-stoplight:
              id: ulmm18mglklba
          system:
            type: boolean
            x-stoplight:
              id: 0vn6xeslme5b2
          company:
            $ref: '#/components/schemas/Company-Read-Nested'
          material_type:
            $ref: '#/components/schemas/MaterialType-Read-Nested'
          state:
            $ref: '#/components/schemas/MaterialState'
          external_id:
            type: string
            x-stoplight:
              id: dr0e9kppho1yy
            nullable: true
        required:
        - name
        - system
        - company
        - material_type
        - state
        - external_id
      - $ref: '#/components/schemas/Timestamps'
    MaterialState:
      title: MaterialState
      x-stoplight:
        id: li8t934rfnen9
      enum:
      - active
      - inactive
      default: active
      description: Material States
    TreadId:
      title: TreadId
      x-stoplight:
        id: 43k4t5tl359m4
      type: object
      required:
      - tread_id
      properties:
        tread_id:
          type: string
          x-stoplight:
            id: zi3ld7djflw6f
          pattern: ^[0-9A-F]{6}$
          minLength: 6
          maxLength: 6
          example: ABC123
          description: Tread ID
      additionalProperties: false
    Material-Read-Typeahead:
      title: Material-Read-Typeahead
      x-stoplight:
        id: 30glh3las0ydb
      allOf:
      - $ref: '#/components/schemas/Identifier'
      - type: object
        required:
        - name
        - external_id
        properties:
          name:
            type: string
            description: Material name
          external_id:
            type: string
            description: Material external_id
            x-stoplight:
              id: ml0l0yvuz5u6d
            nullable: true
