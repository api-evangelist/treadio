        id: os3zgqwwdr5j4
      type: object
      properties:
        site_id:
          type: string
          x-stoplight:
            id: s749p4za9ezo3
          format: uuid
          nullable: true
        customer_rate_id:
          type: string
          x-stoplight:
            id: d0lz0b6qrhxjv
          format: uuid
          nullable: true
        customer_rate_value:
          type: number
          x-stoplight:
            id: zswnlulxi66y2
