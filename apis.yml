name: tread.io
description: >-
  Tread (tread.io / tread.ai) is the operating system for bulk materials hauling — a
  dispatch and logistics TMS for construction-materials producers, contractors, and haulers.
  The Tread Horizon platform unifies order management, truck dispatching, route and driver
  tracking, e-ticketing, driver timesheets, settlements, and billing across web and a mobile
  driver/foreman app. Its public Horizon API V1 is a REST/JSON API (OpenAPI 3.0.3, 562 paths,
  732 operations) covering Projects, Orders, Jobs, Loads, Tickets, Sites, Materials, Equipment,
  Settlements, and Invoices, with HMAC-signed webhooks, bearer-JWT / OAuth2 client-credentials
  auth, cursor pagination, and integrations to QuickBooks, Sage, Vista, Foundation, Spectrum,
  HCSS, Samsara/Geotab telematics, and Agave.
